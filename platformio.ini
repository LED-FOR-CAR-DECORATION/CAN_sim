[platformio]
default_envs = sender

[env]
platform = espressif32 @ 6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_src_filter = +<*> -<can_selftest.cpp>

[env:sender]

[env:receiver]
build_flags = -D KAN_RECEIVER=1

[env:can-selftest]
build_src_filter = -<*> +<can_selftest.cpp>
